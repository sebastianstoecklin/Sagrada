name: SagradaSpace report
description: Report a problem with this SagradaSpace fork
body:
  - type: markdown
    attributes:
      value: |
        SagradaSpace is a fork of AeroSpace. Report fork-specific problems here.
        Only report upstream problems to https://github.com/nikitabobko/AeroSpace after reproducing them on an upstream build.
  - type: textarea
    id: version
    attributes:
      label: Version and macOS
      description: Include the output of sagradaspace --version and your macOS version.
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior, relevant config, and screenshots if useful.
    validations:
      required: true
