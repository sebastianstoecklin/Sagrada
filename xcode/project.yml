# Xcode project configuration. Managed by https://github.com/yonaskolb/XcodeGen
# Xcode is only used to build the release App Bundle. Debug builds only use Swift Package Manager

name: SagradaSpace

packages:
  SagradaSpacePackage:
    path: sagradaspace-package-symlink

configs:
  Debug: debug
  Release: release

settings:
  base:
    TOOLCHAINS: ${XCODEGEN_TOOLCHAINS}
    SWIFT_VERSION: ${XCODEGEN_SWIFT_LANGUAGE_VERSION}
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: SagradaSpace
    MARKETING_VERSION: ${XCODEGEN_SAGRADASPACE_VERSION}
    # https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/LaunchServicesKeys.html#//apple_ref/doc/uid/20001431-108256
    # Specifies whether the app runs as an agent app. If this key is set to YES, Launch Services runs the app as an agent app.
    # Agent apps do not appear in the Dock or in the Force Quit window (cmd-opt-esc)
    INFOPLIST_KEY_LSUIElement: YES
    CODE_SIGN_IDENTITY: ${XCODEGEN_SAGRADASPACE_CODE_SIGN_IDENTITY}

targets:
  SagradaSpace:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - "../Sources/SagradaSpaceApp"
      - "../resources"
      - "../docs/config-examples/default-config.toml"
    dependencies:
      - package: SagradaSpacePackage
        product: AppBundle
    # https://developer.apple.com/documentation/xcode/build-settings-reference
    settings:
      configs:
        Debug:
          PRODUCT_NAME: SagradaSpaceDebug
          PRODUCT_BUNDLE_IDENTIFIER: com.sebastianstoecklin.sagradaspace.debug
        Release:
          PRODUCT_NAME: SagradaSpace
          PRODUCT_BUNDLE_IDENTIFIER: com.sebastianstoecklin.sagradaspace
          SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
          GCC_TREAT_WARNINGS_AS_ERRORS: YES
    entitlements:
      path: ../resources/SagradaSpace.entitlements
      properties:
        # Accessibility API doesn't work in sandboxed apps
        com.apple.security.app-sandbox: false
